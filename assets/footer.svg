<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1500 300" width="1500" height="300" role="img" aria-label="Night sky with twinkling stars, a crescent moon, fireflies and grass">

  <defs>
    <!-- four-point diamond star -->
    <path id="s" fill="#fff"
          d="M0-6 Q.9-.9 6 0 Q.9 .9 0 6 Q-.9 .9 -6 0 Q-.9-.9 0-6 Z"/>

    <!-- firefly glow falloff -->
    <radialGradient id="g">
      <stop offset="0"   stop-color="#ffe15c" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#ffd52e" stop-opacity=".35"/>
      <stop offset="1"   stop-color="#ffd52e" stop-opacity="0"/>
    </radialGradient>

    <!-- firefly: soft halo + bright core -->
    <g id="f">
      <circle r="11" fill="url(#g)"/>
      <circle r="2.2" fill="#fff2a8"/>
    </g>

    <!-- grass blade cluster, rooted at origin -->
    <g id="b" fill="none" stroke="#14311e" stroke-width="3" stroke-linecap="round">
      <path d="M0 0 C1-10 -3-18 -8-26"/>
      <path d="M4 0 C5-12 4-22 1-32"/>
      <path d="M9 0 C11-9 13-19 19-27"/>
      <path d="M-6 0 C-8-8 -13-14 -19-20"/>
      <path d="M14 0 C16-7 20-12 26-16"/>
    </g>
  </defs>

  <!-- ============================== stars ============================== -->
  <g>
    <use xlink:href="#s" transform="translate(70,58) scale(.75)">
      <animate attributeName="opacity" values=".15;1;.15"   dur="3.1s" begin="0s"   repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(188,132) scale(.5)">
      <animate attributeName="opacity" values=".2;.9;.2"    dur="4.4s" begin="1.2s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(295,42) scale(1)">
      <animate attributeName="opacity" values=".1;1;.1"     dur="2.6s" begin=".7s"  repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(402,96) scale(.6)">
      <animate attributeName="opacity" values=".25;.85;.25" dur="5.2s" begin="2.1s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(516,150) scale(.45)">
      <animate attributeName="opacity" values=".15;.95;.15" dur="3.7s" begin=".3s"  repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(610,34) scale(.8)">
      <animate attributeName="opacity" values=".2;1;.2"     dur="4.9s" begin="1.8s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(724,110) scale(.55)">
      <animate attributeName="opacity" values=".1;.9;.1"    dur="2.9s" begin="2.6s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(838,64) scale(.9)">
      <animate attributeName="opacity" values=".2;1;.2"     dur="5.6s" begin=".4s"  repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(946,142) scale(.5)">
      <animate attributeName="opacity" values=".15;.85;.15" dur="3.4s" begin="1.5s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(1058,50) scale(.7)">
      <animate attributeName="opacity" values=".1;1;.1"     dur="4.1s" begin="3.2s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(1164,118) scale(.6)">
      <animate attributeName="opacity" values=".2;.95;.2"   dur="2.8s" begin=".9s"  repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(1244,196) scale(.45)">
      <animate attributeName="opacity" values=".1;.8;.1"    dur="4.6s" begin="3.7s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(1372,146) scale(.85)">
      <animate attributeName="opacity" values=".15;1;.15"   dur="5s"   begin="2.4s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(1436,44) scale(.5)">
      <animate attributeName="opacity" values=".2;.9;.2"    dur="3.6s" begin="1.1s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- =============================== moon ============================== -->
  <g transform="translate(1290,72) scale(2)">
    <circle r="26" fill="#3b4152"/>
    <path d="M4.1-16.5 A17 17 0 1 0 11.4 12.6 A15 15 0 0 1 4.1-16.5 Z" fill="#ffd85e"/>
  </g>

  <!-- =============================== grass ============================= -->
  <g>
    <!-- far rolling hills -->
    <path d="M0,282 C120,262 240,290 380,274 C520,258 640,288 780,272 C920,256 1040,286 1180,270 C1320,256 1420,282 1500,268 L1500,300 L0,300 Z" fill="#1c3f28"/>

    <!-- blades -->
    <use xlink:href="#b" transform="translate(28,290) scale(1.1)"/>
    <use xlink:href="#b" transform="translate(96,291) scale(.8)"/>
    <use xlink:href="#b" transform="translate(158,289) scale(1.25)"/>
    <use xlink:href="#b" transform="translate(232,292) scale(.9)"/>
    <use xlink:href="#b" transform="translate(304,290) scale(1.15)"/>
    <use xlink:href="#b" transform="translate(372,291) scale(.75)"/>
    <use xlink:href="#b" transform="translate(438,289) scale(1.2)"/>
    <use xlink:href="#b" transform="translate(512,292) scale(.95)"/>
    <use xlink:href="#b" transform="translate(580,290) scale(1.05)"/>
    <use xlink:href="#b" transform="translate(650,291) scale(.8)"/>
    <use xlink:href="#b" transform="translate(716,289) scale(1.3)"/>
    <use xlink:href="#b" transform="translate(790,292) scale(.85)"/>
    <use xlink:href="#b" transform="translate(858,290) scale(1.1)"/>
    <use xlink:href="#b" transform="translate(926,291) scale(.7)"/>
    <use xlink:href="#b" transform="translate(992,289) scale(1.2)"/>
    <use xlink:href="#b" transform="translate(1064,292) scale(.9)"/>
    <use xlink:href="#b" transform="translate(1136,290) scale(1.15)"/>
    <use xlink:href="#b" transform="translate(1204,291) scale(.78)"/>
    <use xlink:href="#b" transform="translate(1272,289) scale(1.25)"/>
    <use xlink:href="#b" transform="translate(1346,292) scale(.92)"/>
    <use xlink:href="#b" transform="translate(1414,290) scale(1.08)"/>
    <use xlink:href="#b" transform="translate(1476,291) scale(.82)"/>

    <!-- near ground line -->
    <path d="M0,284 C180,278 320,288 500,282 C680,276 820,287 1000,281 C1180,275 1330,286 1500,280 L1500,300 L0,300 Z" fill="#10281a"/>
  </g>

  <!-- ============================= fireflies ============================ -->
  <g>
    <g transform="translate(150,240)">
      <use xlink:href="#f">
        <animate attributeName="opacity" values="0;.95;.25;.9;.2;.85;0" dur="7.4s" begin="0s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; 54 -32; 18 18; 72 26; -26 -14; 0 0"
                          dur="16s" begin="0s" repeatCount="indefinite"/>
      </use>
    </g>
    <g transform="translate(430,262)">
      <use xlink:href="#f">
        <animate attributeName="opacity" values="0;.85;.2;.95;.15;.9;0" dur="6.2s" begin="1.7s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; -48 -26; 22 -52; -18 12; 46 -34; 0 0"
                          dur="19s" begin=".8s" repeatCount="indefinite"/>
      </use>
    </g>
    <g transform="translate(690,224)">
      <use xlink:href="#f">
        <animate attributeName="opacity" values="0;.9;.15;.85;.25;.95;0" dur="8.1s" begin="2.9s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; 38 44; -44 20; 60 -18; -12 48; 0 0"
                          dur="15s" begin="2.2s" repeatCount="indefinite"/>
      </use>
    </g>
    <g transform="translate(930,268)">
      <use xlink:href="#f">
        <animate attributeName="opacity" values="0;.95;.2;.9;.15;.8;0" dur="5.6s" begin=".9s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; -62 -40; -14 -8; 34 -56; 50 14; 0 0"
                          dur="21s" begin="3.4s" repeatCount="indefinite"/>
      </use>
    </g>
    <g transform="translate(1140,232)">
      <use xlink:href="#f">
        <animate attributeName="opacity" values="0;.85;.25;.95;.2;.9;0" dur="9.3s" begin="3.6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; 46 36; -30 52; -58 6; 24 -28; 0 0"
                          dur="17s" begin="1.3s" repeatCount="indefinite"/>
      </use>
    </g>
    <g transform="translate(1370,266)">
      <use xlink:href="#f">
        <animate attributeName="opacity" values="0;.9;.15;.85;.3;.95;0" dur="6.8s" begin="2.1s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; -52 -50; 30 -20; -20 22; -68 -8; 0 0"
                          dur="18s" begin="4.1s" repeatCount="indefinite"/>
      </use>
    </g>
  </g>

</svg>
