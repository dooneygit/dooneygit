<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1500 300" width="1500" height="300" role="img" aria-label="Night sky with twinkling stars, a crescent moon, fireflies, a zen garden waterfall and grass">

  <defs>
    <!-- four-point diamond star -->
    <path id="s" fill="#fff"
          d="M0-6 Q.9-.9 6 0 Q.9 .9 0 6 Q-.9 .9 -6 0 Q-.9-.9 0-6 Z"/>

    <!-- firefly glow falloff -->
    <radialGradient id="g">
      <stop offset="0"   stop-color="#ffe15c" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#ffd52e" stop-opacity=".35"/>
      <stop offset="1"   stop-color="#ffd52e" stop-opacity="0"/>
    </radialGradient>

    <!-- firefly: soft halo + bright core -->
    <g id="f">
      <circle r="11" fill="url(#g)"/>
      <circle r="2.2" fill="#fff2a8"/>
    </g>

    <!-- grass blade cluster, rooted at origin -->
    <g id="b" fill="none" stroke="#14311e" stroke-width="3" stroke-linecap="round">
      <path d="M0 0 C1-10 -3-18 -8-26"/>
      <path d="M4 0 C5-12 4-22 1-32"/>
      <path d="M9 0 C11-9 13-19 19-27"/>
      <path d="M-6 0 C-8-8 -13-14 -19-20"/>
      <path d="M14 0 C16-7 20-12 26-16"/>
    </g>

    <!-- tall reed cluster, rooted at origin -->
    <g id="p" fill="none" stroke="#2c5c3a" stroke-width="2" stroke-linecap="round">
      <path d="M0 0 C-1-14 -4-26 -9-38"/>
      <path d="M4 0 C4-16 6-30 11-42"/>
      <path d="M-5 0 C-7-12 -12-22 -18-30"/>
      <path d="M9 0 C11-13 16-24 23-32"/>
      <path d="M-1 0 C0-18 1-32 2-46"/>
      <path d="M14 0 C15-10 19-18 25-24"/>
    </g>

    <!-- falling water sheet -->
    <linearGradient id="w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#dff1fb" stop-opacity=".8"/>
      <stop offset="1"   stop-color="#7fa8c2" stop-opacity=".45"/>
    </linearGradient>
  </defs>

  <!-- ============================== stars ============================== -->
  <g>
    <use xlink:href="#s" transform="translate(70,58) scale(.75)">
      <animate attributeName="opacity" values=".15;1;.15"   dur="3.1s" begin="0s"   repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(188,132) scale(.5)">
      <animate attributeName="opacity" values=".2;.9;.2"    dur="4.4s" begin="1.2s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(295,42) scale(1)">
      <animate attributeName="opacity" values=".1;1;.1"     dur="2.6s" begin=".7s"  repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(402,96) scale(.6)">
      <animate attributeName="opacity" values=".25;.85;.25" dur="5.2s" begin="2.1s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(516,150) scale(.45)">
      <animate attributeName="opacity" values=".15;.95;.15" dur="3.7s" begin=".3s"  repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(610,34) scale(.8)">
      <animate attributeName="opacity" values=".2;1;.2"     dur="4.9s" begin="1.8s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(724,110) scale(.55)">
      <animate attributeName="opacity" values=".1;.9;.1"    dur="2.9s" begin="2.6s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(838,64) scale(.9)">
      <animate attributeName="opacity" values=".2;1;.2"     dur="5.6s" begin=".4s"  repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(946,142) scale(.5)">
      <animate attributeName="opacity" values=".15;.85;.15" dur="3.4s" begin="1.5s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(1058,50) scale(.7)">
      <animate attributeName="opacity" values=".1;1;.1"     dur="4.1s" begin="3.2s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(1164,118) scale(.6)">
      <animate attributeName="opacity" values=".2;.95;.2"   dur="2.8s" begin=".9s"  repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(1244,196) scale(.45)">
      <animate attributeName="opacity" values=".1;.8;.1"    dur="4.6s" begin="3.7s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(1372,146) scale(.85)">
      <animate attributeName="opacity" values=".15;1;.15"   dur="5s"   begin="2.4s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#s" transform="translate(1436,44) scale(.5)">
      <animate attributeName="opacity" values=".2;.9;.2"    dur="3.6s" begin="1.1s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- =============================== moon ============================== -->
  <g transform="translate(1290,72) scale(2)">
    <circle r="26" fill="#3b4152"/>
    <path d="M4.1-16.5 A17 17 0 1 0 11.4 12.6 A15 15 0 0 1 4.1-16.5 Z" fill="#ffd85e"/>
  </g>

  <!-- =============================== grass ============================= -->
  <g>
    <!-- far rolling hills -->
    <path d="M0,282 C120,262 240,290 380,274 C520,258 640,288 780,272 C920,256 1040,286 1180,270 C1320,256 1420,282 1500,268 L1500,300 L0,300 Z" fill="#1c3f28"/>

    ============================ waterfall ===========================
    <g transform="translate(42,105) scale(1.25)">
      <!-- back rock mass -->
      <path d="M62 70 C54 46 86 24 132 22 C178 20 234 32 252 50 C258 56 260 64 258 70 Z" fill="#202836"/>
      <path d="M256 62 C254 50 270 42 288 42 C306 42 318 50 316 60 C315 66 304 68 288 68 L268 68 C260 68 257 66 256 62 Z" fill="#202836"/>
      <ellipse cx="156" cy="30" rx="66" ry="7" fill="#4b5670" opacity=".18"/>

      <!-- reeds rooted between the rocks -->
      <use xlink:href="#p" transform="translate(72,58) scale(1.2)"/>
      <use xlink:href="#p" transform="translate(296,50) scale(1)"/>

      <!-- upper fall -->
      <path d="M140 44 C139 60 137 72 134 86 L196 86 C192 72 189 60 188 44 Z" fill="url(#w)"/>
      <path d="M138 45 C154 41 174 41 190 45" fill="none" stroke="#eaf6fb" stroke-opacity=".5" stroke-width="1.6"/>
      <g fill="none" stroke="#eaf6fb" stroke-opacity=".75" stroke-width="1.5" stroke-linecap="round">
        <path d="M142 48 C140 62 138 72 136 82" stroke-dasharray="9 13">
          <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.1s" repeatCount="indefinite"/>
        </path>
        <path d="M151 46 C150 62 150 72 149 82" stroke-dasharray="14 10">
          <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.4s" repeatCount="indefinite"/>
        </path>
        <path d="M160 46 C160 62 160 72 160 82" stroke-dasharray="7 15">
          <animate attributeName="stroke-dashoffset" values="0;-22" dur=".9s"  repeatCount="indefinite"/>
        </path>
        <path d="M169 46 C169 62 170 72 170 82" stroke-dasharray="12 12">
          <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.3s" repeatCount="indefinite"/>
        </path>
        <path d="M178 46 C179 62 179 72 180 82" stroke-dasharray="10 14">
          <animate attributeName="stroke-dashoffset" values="0;-24" dur="1s"   repeatCount="indefinite"/>
        </path>
        <path d="M187 48 C188 62 190 72 192 82" stroke-dasharray="16 8">
          <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.6s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- middle rocks -->
      <g transform="rotate(-8 60 80)">
        <path d="M8 94 C0 68 22 50 56 50 C90 50 114 68 112 88 C111 96 98 100 72 100 L30 100 C16 100 9 99 8 94 Z" fill="#303c50"/>
        <ellipse cx="54" cy="58" rx="34" ry="5" fill="#7c88a4" opacity=".18"/>
      </g>
      <g transform="rotate(6 252 80)">
        <path d="M192 90 C188 74 220 62 258 62 C298 62 316 72 314 86 C313 93 294 98 262 98 L216 98 C200 98 193 95 192 90 Z" fill="#303c50"/>
