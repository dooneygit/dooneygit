    </g>
    <g transform="translate(930,268)">
      <use xlink:href="#f">
        <animate attributeName="opacity" values="0;.95;.2;.9;.15;.8;0" dur="5.6s" begin=".9s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; -62 -40; -14 -8; 34 -56; 50 14; 0 0"
                          dur="21s" begin="3.4s" repeatCount="indefinite"/>
      </use>
    </g>
    <g transform="translate(1140,232)">
      <use xlink:href="#f">
        <animate attributeName="opacity" values="0;.85;.25;.95;.2;.9;0" dur="9.3s" begin="3.6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; 46 36; -30 52; -58 6; 24 -28; 0 0"
                          dur="17s" begin="1.3s" repeatCount="indefinite"/>
      </use>
    </g>
    <g transform="translate(1370,266)">
      <use xlink:href="#f">
        <animate attributeName="opacity" values="0;.9;.15;.85;.3;.95;0" dur="6.8s" begin="2.1s" repeatCount="indefinite"/>
