      <!-- lower fall -->
      <path d="M112 84 C106 104 98 120 84 136 L228 136 C214 120 206 104 198 84 Z" fill="url(#w)"/>
      <path d="M110 86 C144 81 176 81 200 86" fill="none" stroke="#eaf6fb" stroke-opacity=".45" stroke-width="1.6"/>
      <g fill="none" stroke="#eaf6fb" stroke-opacity=".7" stroke-width="1.5" stroke-linecap="round">
        <path d="M114 90 C109 106 101 118 90 132" stroke-dasharray="8 14">
          <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.2s" repeatCount="indefinite"/>
        </path>
        <path d="M130 88 C128 104 125 116 122 128" stroke-dasharray="15 9">
          <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.5s" repeatCount="indefinite"/>
        </path>
        <path d="M142 88 C141 104 139 116 137 128" stroke-dasharray="11 13">
          <animate attributeName="stroke-dashoffset" values="0;-24" dur="1s"   repeatCount="indefinite"/>
        </path>
        <path d="M154 88 C154 104 153 116 152 128" stroke-dasharray="7 15">
