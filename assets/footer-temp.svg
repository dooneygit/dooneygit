        <circle cx="196" cy="126" r="2" opacity=".45">
          <animate attributeName="opacity" values=".15;.55;.15" dur="2.8s" begin=".6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="120" cy="122" r="1.6" opacity=".4">
          <animate attributeName="opacity" values=".1;.5;.1" dur="3.4s" begin="1.3s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g fill="none" stroke="#7fb3cc" stroke-width="1.4" stroke-linecap="round">
        <path d="M40 134 C74 130 108 134 142 131" opacity=".3">
          <animate attributeName="opacity" values=".12;.4;.12" dur="4.3s" repeatCount="indefinite"/>
        </path>
        <path d="M186 138 C218 135 252 139 286 135" opacity=".25">
          <animate attributeName="opacity" values=".1;.35;.1"  dur="5.6s" begin="1.4s" repeatCount="indefinite"/>
        </path>
        <path d="M82 140 C114 137 146 141 178 138" opacity=".2">
          <animate attributeName="opacity" values=".08;.3;.08" dur="3.8s" begin="2.7s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- foreground stone and reed -->
      <path d="M96 138 C94 130 108 126 128 126 C148 126 158 130 156 137 C155 142 142 144 124 144 L110 144 C101 144 97 142 96 138 Z" fill="#3c4759"/>
