        </path>
        <path d="M190 88 C191 104 193 116 195 128" stroke-dasharray="16 8">
          <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.2s" repeatCount="indefinite"/>
        </path>
        <path d="M196 88 C201 106 209 118 220 132" stroke-dasharray="10 12">
          <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.4s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- front rocks -->
      <g transform="rotate(5 40 122)">
        <path d="M-26 128 C-30 114 2 106 46 108 C88 110 106 116 104 126 C103 134 80 138 44 138 L2 138 C-14 138 -25 134 -26 128 Z" fill="#45526a"/>
        <ellipse cx="46" cy="112" rx="42" ry="5" fill="#7c88a4" opacity=".22"/>
      </g>
      <g transform="rotate(-6 268 118)">
        <path d="M204 132 C196 110 228 92 268 92 C312 92 336 108 334 126 C333 136 308 141 272 141 L232 141 C212 141 206 138 204 132 Z" fill="#45526a"/>
        <ellipse cx="268" cy="99" rx="46" ry="6" fill="#7c88a4" opacity=".22"/>
      </g>

      <!-- pool -->
      <ellipse cx="158" cy="132" rx="172" ry="14" fill="#33556d"/>
      <ellipse cx="152" cy="132" rx="66" ry="8" fill="#eaf6fb" opacity=".5">
        <animate attributeName="opacity" values=".35;.65;.35" dur="2.6s" repeatCount="indefinite"/>
